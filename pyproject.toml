[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-radar-intercept"
version = "0.1.0"
description = "Offline game projectile radar and interception simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex" }]
keywords = ["game", "simulation", "radar", "tracking", "intercept"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment :: Simulation",
]

[project.scripts]
game-radar = "game_radar.app:main"

[tool.setuptools.packages.find]
where = ["src"]
